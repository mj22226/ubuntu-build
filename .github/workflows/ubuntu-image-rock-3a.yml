name: ubuntu-image-rock-3a
on: workflow_dispatch
jobs:
  command:
    name: Use Linux commands
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
              root-reserve-mb: 512
              swap-size-mb: 1024
              remove-dotnet: 'true'
              overprovision-lvm: 'true'
              remove-android: 'true'
              remove-haskell: 'true'
              remove-codeql: 'true'
              remove-docker-images: 'true'
      - name: Checkout
        uses: actions/checkout@main

      - name: u-boot
        run: /bin/bash  ./das-u-boot.sh rock-3a-rk3568_defconfig

      - name: kernel
        run: /bin/bash ./build-kernel.sh arm64 2>&1|tee log1
        
      - name: rootfs
        run: |
            ls
            chmod +x ubuntu-image.sh
            sudo  ./ubuntu-image.sh

      - name: disk image
        run:  |
            chmod +x disk_image.sh
            sudo  ./disk_image.sh arm64 rock-3a rk3568-rock-3a
            echo "============================"
            ls -l
            echo "============================="

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: cat kernel_version >> $GITHUB_OUTPUT
        
      - name: Create Release and Upload
        uses: softprops/action-gh-release@master
        with:
          tag_name: rock3a-dev-${{ github.run_number }}
          name: "Radxa Rock 3A ${{ github.run_number }}"
          body: |
            Radxa Rock 3A Custom Ubuntu Image
            Build Date: ${{ steps.date.outputs.now }}
            Kernel Version: ${{ steps.kernel.outputs.kernel_version }}
          draft: false
          prerelease: false
          files: |
             ./Ubuntu-*img.xz
             ./u-boot-*.bin
             ./*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
