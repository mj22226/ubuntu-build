# This is a basic workflow to help you get started with Actions

name: ubuntu-image-rock-3a
on: workflow_dispatch
#workflow_dispatch
#[push]
jobs:
  command:
    name: Use Linux commands
    runs-on: ubuntu-24.04-arm
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@main

      - name: u-boot
        run: /bin/bash  ./das-u-boot.sh rock-3a-rk3568_defconfig

      - name: kernel
        run: /bin/bash ./build-kernel.sh arm64 2>&1|tee log1
        
      - name: rootfs
        run: |
            ls
            chmod +x ubuntu-image.sh
            sudo  ./ubuntu-image.sh

      - name: disk image
        run:  |
            chmod +x disk_image.sh
            sudo  ./disk_image.sh arm64 rock-3a rk3568-rock-3a
            echo "============================"
            ls -l
            echo "============================="

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: cat kernel_version >> $GITHUB_OUTPUT
        
# 旧: upload-artifact のステップをコメントアウトまたは削除し、以下を追加
      - name: Create Release and Upload
        uses: softprops/action-gh-release@master
        with:
          # 実行するたびにユニークなタグ名（例: build-1, build-2...）を付けます
          tag_name: build-${{ github.run_number }}
          name: "Radxa Rock 3A Disk Image Build ${{ github.run_number }}"
          body: |
            Radxa Rock 3A 自作ディスクイメージ
            ビルド日時: ${{ steps.date.outputs.now }}
            ベースカーネル: ${{ steps.kernel.outputs.kernel_version }}
          draft: false
          prerelease: false
          # ここに圧縮済みファイルのパスを指定します
          files: ./Ubuntu-*img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
